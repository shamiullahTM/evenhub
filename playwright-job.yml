apiVersion: batch/v1
kind: Job
metadata:
  name: playwright-tests
spec:
  parallelism: 3
  completions: 3
  template:
    spec:
      containers:
      - name: playwright
        image: mohammedshami/eventhub-tests:latest
        command: ["npx", "playwright", "test", "--workers=4"]
        volumeMounts:
        - name: reports
          mountPath: /reports
      restartPolicy: Never
      volumes:
      - name: reports
        emptyDir: {}
